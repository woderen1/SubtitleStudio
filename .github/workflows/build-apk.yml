name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      # 1. 生成 pubspec 里声明为 asset 的 .env
      - name: Create .env asset
        run: printf 'GEMINI_API_KEY=%s\n' "${GEMINI_API_KEY}" > .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 2. android 目录若缺失则自动生成
      - name: Ensure android platform
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name subtitle_studio .
          fi

      - name: Pub get
        run: flutter pub get

      # 3. ffmpeg_kit 要求 NDK 27，先写进 gradle 免得报错
      - name: Pin NDK version
        run: |
          f=android/app/build.gradle.kts
          [ -f "$f" ] || f=android/app/build.gradle
          if ! grep -q ndkVersion "$f"; then
            sed -i '0,/^android {/s//android {\n    ndkVersion = "27.0.12077973"/' "$f"
          fi
          grep -n ndkVersion "$f" || true

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: SubtitleStudio-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
